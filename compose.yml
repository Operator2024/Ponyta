services:
  prometheus:
    image: prom/prometheus@sha256:565ee86501224ebbb98fc10b332fa54440b100469924003359edf49cbce374bd
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.config.file=/etc/prometheus/web.yml'
      - '--web.enable-lifecycle'
      - '--web.external-url=${PROM_URL}'
      - '--storage.tsdb.retention.time=31d'
      - '--log.level=debug'
    ports:
      - 172.18.0.1:9090:${PROM_PORT}
    restart: unless-stopped
    volumes:
      - ./prometheus:/etc/prometheus
      - ~/app/certs/fullchain.pem:/etc/prometheus/certs/tls.crt
      - ~/app/certs/privkey.pem:/etc/prometheus/certs/tls.key
      - prom_data:/prometheus
    networks:
      local-network:
        ipv4_address: 172.18.0.254
  ping_exporter:
    image: czerwonk/ping_exporter@sha256:11592d365c3331db72fc7351ec980401e792d638f834593603fac5ee25a27495
    container_name: ping_exporter
    ports:
      - 172.18.0.1:9427:9427
    restart: unless-stopped
    volumes:
      - ./ping_exporter:/config:ro
    networks:
      local-network:
        ipv4_address: 172.18.0.2
  node_exporter:
    image: quay.io/prometheus/node-exporter@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706
    container_name: node_exporter
    command:
      - '--path.rootfs=/host'
      - '--collector.processes'
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'
  snmp_exporter:
    # main branch pin to last image
    image: quay.io/prometheus/snmp-exporter@sha256:08392fc5c93b0761fc4a6b09e51b7094c961e22d701f06f42adc51e5869fe888
    container_name: snmp_exporter
    command:
      - '--config.file=/snmp.yml'
      - '--config.expand-environment-variables'
      - '--log.level=debug'
    ports:
      -  172.18.0.1:9116:9116
    restart: unless-stopped
    volumes:
      - ./snmp.yml:/snmp.yml
    networks:
      local-network:
        ipv4_address: 172.18.0.4
  grafana:
    image: grafana/grafana@sha256:8d938a1c52b018c60cb3583657e038054387aa18a74f09a865c99a522481f7ac
    container_name: grafana
    ports:
      - ${GF_PORT}:3000/tcp
    restart: unless-stopped
    environment:
      - PROM_PORT=${PROM_PORT}
      - GF_SECURITY_ADMIN_USER=${GF_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECRET}
      - GF_SERVER_HTTP_PORT=3000
      - GF_SERVER_CERT_FILE=/etc/grafana/certs/tls.crt
      - GF_SERVER_CERT_KEY=/etc/grafana/certs/tls.key
      - GF_SERVER_PROTOCOL=https
      - GF_SERVER_ROOT_URL=${GF_SUB_PATH}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_DOMAIN=${DOMAIN}
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST}
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD}
      - GF_SMTP_SKIP_VERIFY=false
      - GF_SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS}
      - GF_SMTP_FROM_NAME=Grafana
      - GF_SMTP_STARTTLS_POLICY=MandatoryStartTLS
      # disable metrics in grafana http
      - GF_METRICS_ENABLED=true
      - GF_METRICS_BASIC_AUTH_USERNAME=${GF_USER}
      - GF_METRICS_BASIC_AUTH_PASSWORD=${GF_SECRET}
      - GF_METRICS_DISABLE_TOTAL_STATS=false # disable_total_stats
      - GF_METRICS_TOTAL_STATS_COLLECTOR_INTERVAL_SECONDS=120 #total_stats_collector_interval_seconds
      - GF_SERVER_NAME=${DOMAIN}
      # - GF_LOG_LEVEL=debug
    volumes:
      - ./grafana:/etc/grafana/provisioning/datasources
      - ~/app/certs/fullchain.pem:/etc/grafana/certs/tls.crt
      - ~/app/certs/privkey.pem:/etc/grafana/certs/tls.key
      - 'grafana_storage:/var/lib/grafana'
    networks:
      local-network:
        ipv4_address: 172.18.0.3
volumes:
  prom_data:
  grafana_storage:

networks:
  local-network:
    ipam:
      driver: default
      config:
        - subnet: 172.18.0.0/24
          gateway: 172.18.0.1