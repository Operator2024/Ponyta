services:
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.config.file=/etc/prometheus/web.yml'
      - '--web.enable-lifecycle'
      - '--web.external-url=${PROM_URL}'
      - '--storage.tsdb.retention.time=31d'
      - '--log.level=debug'
      - '--web.route-prefix=/'
    ports:
      - 172.18.0.1:${PROM_PORT}:${PROM_PORT}
    restart: unless-stopped
    volumes:
      - ./prometheus:/etc/prometheus
      - ./certs:/etc/prometheus/certs
      - prom_data:/prometheus
    networks:
      local-network:
        ipv4_address: 172.18.0.254
  ping_exporter:
    image: czerwonk/ping_exporter:v1.1.3
    container_name: ping_exporter
    environment:
      - CONFIG_FILE=/config/ping.yml
    ports:
      - 172.18.0.1:9427:9427
    restart: unless-stopped
    volumes:
      - ./ping_exporter:/config:ro
    networks:
      local-network:
        ipv4_address: 172.18.0.2
  node_exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    container_name: node_exporter
    command:
      - '--path.rootfs=/host'
      - '--collector.processes'
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'
  snmp_exporter:
    # main branch pin to last image
    image: quay.io/prometheus/snmp-exporter:v0.29.0
    container_name: snmp_exporter
    command:
      - '--config.file=/snmp.yml'
      - '--config.expand-environment-variables'
      - '--log.level=debug'
    environment:
      - SNMP_USER=${SNMP_USER}
      - SNMP_SECRET=${SNMP_SECRET}
    ports:
      -  172.18.0.1:9116:9116
    restart: unless-stopped
    volumes:
      - ./snmp.yml:/snmp.yml
    networks:
      local-network:
        ipv4_address: 172.18.0.4
  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - ${GF_EXTRNAL_PORT}:3000/tcp
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_SERVER_HTTP_PORT=3000
      - GF_SERVER_CERT_FILE=${GF_SERVER_CERT_FILE}
      - GF_SERVER_CERT_KEY=${GF_SERVER_CERT_KEY}
      - GF_SERVER_PROTOCOL=${GF_SERVER_PROTOCOL}
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_DOMAIN=${GF_SERVER_DOMAIN}
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED}
      - GF_SMTP_HOST=${GF_SMTP_HOST}
      - GF_SMTP_USER=${GF_SMTP_USER}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD}
      - GF_SMTP_SKIP_VERIFY=${GF_SMTP_SKIP_VERIFY}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS}
      - GF_SMTP_FROM_NAME=${GF_SMTP_FROM_NAME}
      - GF_SMTP_STARTTLS_POLICY=${GF_SMTP_STARTTLS_POLICY}
      # disable metrics in grafana http
      - GF_METRICS_ENABLED=true
      - GF_METRICS_BASIC_AUTH_USERNAME=${GF_SECURITY_ADMIN_USER}
      - GF_METRICS_BASIC_AUTH_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_METRICS_DISABLE_TOTAL_STATS=false # disable_total_stats
      - GF_METRICS_TOTAL_STATS_COLLECTOR_INTERVAL_SECONDS=120 #total_stats_collector_interval_seconds
      - GF_SERVER_NAME=${GF_SERVER_NAME}
      # - GF_LOG_LEVEL=debug
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./certs:/etc/grafana/certs
      - grafana_storage:/var/lib/grafana
    networks:
      local-network:
        ipv4_address: 172.18.0.3

  blackbox_exporter:
    image: prom/blackbox-exporter:v0.26.0
    container_name: blackbox
    ports:
    - 172.18.0.1:9115:9115
    command:
    - --config.file=/etc/blackbox/blackbox.yml
    volumes:
    - ./blackbox_exporter/blackbox.yml:/etc/blackbox/blackbox.yml
    networks:
      local-network:
        ipv4_address: 172.18.0.5
    restart: unless-stopped

volumes:
  prom_data:
  grafana_storage:

networks:
  local-network:
    ipam:
      driver: default
      config:
        - subnet: 172.18.0.0/24
          gateway: 172.18.0.1
